[project]
name = "iso-trazabilidad"
version = "0.1.0"
description = "ISO Trace: trazabilidad de referencias entre documentos ISO y análisis de impacto"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "networkx>=3.3",
    "openpyxl>=3.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pymupdf>=1.24,<2",
    "python-docx>=1.1",
    "sqlalchemy>=2.0.30",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
iso-trace = "app.cli:app"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["frontend", "samples", "data", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-m 'not real_docs and not benchmark'"
markers = [
    "real_docs: pruebas con documentos reales (requiere ISO_REAL_SAMPLES_DIR)",
    "benchmark: rendimiento con 500 documentos sintéticos (uv run pytest -m benchmark -s)",
]
